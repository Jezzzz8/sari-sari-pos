<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sari-Sari Store POS</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/modal.css" />
    <link rel="stylesheet" href="css/receipt.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
</head>
<body>

    <!-- POS CONTAINER -->
    <div class="pos-container" id="app">

        <!-- HEADER -->
        <header class="header">
            <div class="logo">
                <span>POS</span> Sari-Sari Store
            </div>
            <div class="header-actions">
                <div class="search-wrapper">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="10" cy="10" r="7" />
                        <path d="M21 21l-4.35-4.35" />
                    </svg>
                    <input type="text" id="searchInput" placeholder="Search product..." />
                </div>
                <!-- Mobile category dropdown moved to grid-header -->
                <button class="btn-report" id="btnReport">Sales Report</button>
            </div>
        </header>

        <!-- MAIN BODY -->
        <div class="main-body">

            <!-- POS VIEW -->
            <div id="pos-view" style="display:flex; flex:1; overflow:hidden;">

                <!-- CATEGORIES PANEL -->
                <aside class="categories-panel" id="categoriesPanel">
                    <div class="cat-title">Categories</div>
                </aside>

                <!-- PRODUCTS PANEL -->
                <section class="products-panel" id="productsPanel">
                    <div class="grid-header">
                        <h2 id="categoryTitle">All Products</h2>
                        <div class="header-controls">
                            <!-- Category dropdown for mobile (now placed here) -->
                            <select class="category-select-mobile" id="categoryMobile">
                                <option value="all">All</option>
                                <option value="snacks">Snacks</option>
                                <option value="drinks">Drinks</option>
                                <option value="rice">Rice</option>
                                <option value="canned">Canned Goods</option>
                                <option value="condiments">Condiments</option>
                                <option value="frozen">Frozen</option>
                                <option value="fruits">Fruits</option>
                                <option value="vegetables">Vegetables</option>
                                <option value="other">Other</option>
                            </select>
                            <select class="sort-select" id="sortFilter">
                                <option value="default">Sort</option>
                                <option value="price-low">Price: Low to High</option>
                                <option value="price-high">Price: High to Low</option>
                                <option value="name-az">Name: A to Z</option>
                                <option value="name-za">Name: Z to A</option>
                            </select>
                            <span class="count" id="productCount">0 items</span>
                        </div>
                    </div>
                    <div class="product-grid" id="productGrid"></div>
                </section>

                <!-- BILL PANEL -->
                <aside class="bill-panel" id="billPanel">
                    <div class="bill-header">
                        <h3>🧾 Current Bill</h3>
                        <div class="bill-meta">
                            <span id="billDate">-</span>
                        </div>
                    </div>
                    <div class="bill-items" id="billItems">
                        <div class="bill-empty">No items added yet.<br/><span class="text-muted">Click a product to start.</span></div>
                    </div>
                    <div class="bill-footer" id="billFooter">
                        <div class="summary-row"><span>Subtotal</span><span id="billSubtotal">₱0.00</span></div>
                        <div class="summary-row grand"><span>Total Due</span><span id="billGrandTotal">₱0.00</span></div>
                        <button class="btn-checkout" id="checkoutBtn" disabled>Checkout</button>
                    </div>
                </aside>
            </div>
        </div>
    </div>

    <!-- MOBILE BILL FLOATING SUMMARY BAR -->
    <div class="mobile-bill-summary" id="mobileBillSummary" style="display:none;">
        <div class="mobile-bill-summary-inner">
            <span class="mobile-bill-items" id="mobileBillItems">🛒 0 items</span>
            <span class="mobile-bill-total" id="mobileBillTotal">₱0.00</span>
            <span class="mobile-bill-arrow">▲</span>
        </div>
    </div>

    <!-- MOBILE BILL OVERLAY -->
    <div class="modal-overlay mobile-bill-overlay" id="mobileBillOverlay">
        <div class="modal mobile-bill-modal">
            <button class="modal-close" id="mobileBillClose">✕</button>
            <div class="modal-title">🧾 Current Bill</div>
            <div class="mobile-bill-date" id="mobileBillDate">-</div>
            <div class="mobile-bill-items-list" id="mobileBillItemsList">
                <div class="bill-empty">No items added yet.</div>
            </div>
            <div class="mobile-bill-summary-footer">
                <div class="summary-row"><span>Subtotal</span><span id="mobileBillSubtotal">₱0.00</span></div>
                <div class="summary-row grand"><span>Total Due</span><span id="mobileBillGrandTotal">₱0.00</span></div>
                <button class="btn-checkout" id="mobileCheckoutBtn" disabled>Checkout</button>
            </div>
        </div>
    </div>

    <!-- QUANTITY KEYPAD MODAL -->
    <div class="modal-overlay" id="qtyModal">
        <div class="modal qty-modal">
            <button class="modal-close" id="qtyClose">✕</button>
            <div class="qty-display" id="qtyDisplay">1</div>
            <div class="qty-grid">
                <button data-val="1">1</button>
                <button data-val="2">2</button>
                <button data-val="3">3</button>
                <button data-val="back" class="btn-back">⌫</button>
                <button data-val="4">4</button>
                <button data-val="5">5</button>
                <button data-val="6">6</button>
                <button data-val="clear">C</button>
                <button data-val="7">7</button>
                <button data-val="8">8</button>
                <button data-val="9">9</button>
                <button data-val="0">0</button>
            </div>
            <button class="btn-add-qty" id="btnAddQty">➕ Add to Bill</button>
        </div>
    </div>

    <!-- CHECKOUT MODAL -->
    <div class="modal-overlay" id="checkoutModal">
        <div class="modal">
            <button class="modal-close" id="checkoutClose">✕</button>
            <div class="modal-title">💳 Checkout</div>
            <div class="checkout-summary">
                <div class="cs-row"><span>Items</span><span id="coItems">0</span></div>
                <div class="cs-row total"><span>Total Due</span><span class="amount" id="coTotal">₱0.00</span></div>
            </div>
            <div class="checkout-input-group">
                <label for="cashInput">Cash Received</label>
                <div class="input-with-icon">
                    <span>₱</span>
                    <input type="number" id="cashInput" placeholder="0.00" step="0.01" min="0" />
                </div>
            </div>
            <div class="change-display">
                <div class="change-label">Change</div>
                <div class="change-amount" id="changeDisplay">₱0.00</div>
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" id="checkoutCancel">Cancel</button>
                <button class="btn-complete" id="checkoutComplete" disabled>Complete Transaction</button>
            </div>
        </div>
    </div>

    <!-- RECEIPT MODAL -->
    <div class="modal-overlay receipt-modal" id="receiptModal">
        <div class="modal">
            <button class="modal-close" id="receiptClose">✕</button>
            <div class="receipt-content" id="receiptContent"></div>
            <div class="receipt-actions">
                <button class="btn-print" id="btnPrintReceipt">🖨 Print Receipt</button>
                <button class="btn-close-receipt" id="receiptClose2">Close</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
