<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reports - Sari-Sari POS</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/reports.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
</head>
<body>

    <div class="pos-container reports-page">
        <!-- HEADER -->
        <header class="header">
            <div class="logo">
                <span>POS</span> Sari-Sari Store
            </div>
            <div class="header-actions">
                <div class="search-wrapper">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="10" cy="10" r="7" />
                        <path d="M21 21l-4.35-4.35" />
                    </svg>
                    <input type="text" id="searchReport" placeholder="Search transaction..." />
                </div>
                <button class="btn-report" onclick="window.location.href='index.html'">Back to POS</button>
            </div>
        </header>

        <!-- MAIN BODY -->
        <div class="main-body">
            <!-- CATEGORIES PANEL (desktop) -->
            <aside class="categories-panel" id="categoriesPanel">
                <div class="cat-title">Categories</div>
            </aside>

            <!-- MAIN CONTENT -->
            <section class="products-panel reports-content">
                <div class="grid-header">
                    <h2 id="pageTitle">Transaction History</h2>
                </div>

                <!-- STAT CARDS -->
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="label">Total Sales</div>
                        <div class="value" id="totalSales">₱0.00</div>
                    </div>
                    <div class="stat-card">
                        <div class="label">Total Transactions</div>
                        <div class="value" id="totalTxns">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="label">Most Purchased Product</div>
                        <div class="value" id="topProduct" style="font-size: 18px;">N/A</div>
                    </div>
                </div>

                <!-- FILTER ROW: dateRange + category (mobile only) + sort + count -->
                <div class="filter-row">
                    <select class="category-select" id="dateRange">
                        <option value="all">Date Range (All)</option>
                        <option value="today">Today</option>
                        <option value="week">This Week</option>
                        <option value="month">This Month</option>
                    </select>

                    <!-- Category dropdown – hidden on desktop, shown on mobile -->
                    <select class="category-select category-select-mobile" id="categoryReport">
                        <option value="all">All Categories</option>
                        <option value="snacks">Snacks</option>
                        <option value="drinks">Drinks</option>
                        <option value="rice">Rice</option>
                        <option value="canned">Canned Goods</option>
                        <option value="condiments">Condiments</option>
                        <option value="frozen">Frozen</option>
                        <option value="fruits">Fruits</option>
                        <option value="vegetables">Vegetables</option>
                        <option value="other">Other</option>
                    </select>

                    <div class="filter-controls-right">
                        <select class="sort-select" id="sortReport">
                            <option value="date-desc">Date: Newest</option>
                            <option value="date-asc">Date: Oldest</option>
                            <option value="total-desc">Total: High to Low</option>
                            <option value="total-asc">Total: Low to High</option>
                        </select>
                        <span class="count" id="txnCount">0 transactions</span>
                    </div>
                </div>

                <!-- TRANSACTIONS TABLE -->
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th style="width: 40px;"></th>
                                <th>Order ID</th>
                                <th>Date &amp; Time</th>
                                <th>Items</th>
                                <th>Total</th>
                            </tr>
                        </thead>
                        <tbody id="txnTableBody">
                            <!-- Rendered via JS -->
                        </tbody>
                    </table>
                    <!-- Pagination controls -->
                    <div class="pagination-controls">
                        <button id="prevPage" disabled>◀</button>
                        <span id="pageIndicator">1 / 1</span>
                        <button id="nextPage">▶</button>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <script type="module" src="js/reports.js"></script>
</body>
</html>
